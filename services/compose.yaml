name: fieldos
services:
  admin:
    image: ghcr.io/crosstalk-solutions/project-nomad:v1.35.1@sha256:1445a3eaba19801ce27435b7edc57fce74d9543601808d719b432e3bc7468ea1
    container_name: nomad_admin
    restart: unless-stopped
    init: true
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - /var/lib/fieldos/storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NODE_ENV: production
      NOMAD_STORAGE_PATH: /var/lib/fieldos/storage
      PORT: "8080"
      LOG_LEVEL: info
      APP_KEY: ${APP_KEY:?generated by FieldOS first boot}
      HOST: 0.0.0.0
      URL: http://localhost:8080
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: nomad
      DB_USER: nomad_user
      DB_PASSWORD: ${DB_PASSWORD:?generated by FieldOS first boot}
      DB_NAME: nomad
      DB_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      OLLAMA_NO_CLOUD: "1"
      DISABLE_COMPRESSION: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    container_name: nomad_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?generated by FieldOS first boot}
      MYSQL_DATABASE: nomad
      MYSQL_USER: nomad_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?generated by FieldOS first boot}
    volumes:
      - /var/lib/fieldos/mysql:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    container_name: nomad_redis
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - /var/lib/fieldos/redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.33.3@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2
    container_name: nomad_ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
    ports:
      - 127.0.0.1:11434:11434
    volumes:
      - /var/lib/fieldos/storage/ollama:/root/.ollama

  qdrant:
    image: qdrant/qdrant:v1.16@sha256:0425e3e03e7fd9b3dc95c4214546afe19de2eb2e28ca621441a56663ac6e1f46
    container_name: nomad_qdrant
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - 127.0.0.1:6333:6333
    volumes:
      - /var/lib/fieldos/qdrant:/qdrant/storage

  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:3.8.1@sha256:a80b64909744930d79be14542048d1fbf11f1fdd9ffe6712ef8c9cd3aa1740dd
    container_name: nomad_kiwix_server
    restart: unless-stopped
    command: [--library, /data/kiwix-library.xml, --monitorLibrary, --address=all]
    ports:
      - 127.0.0.1:8090:8080
    volumes:
      - /var/lib/fieldos/storage/zim:/data

  dozzle:
    image: amir20/dozzle:v10.0@sha256:d383abf0fee72a8037d6ec6474424e56d752a52208e0ed70f4805e9d86a77830
    container_name: nomad_dozzle
    restart: unless-stopped
    ports:
      - 127.0.0.1:9999:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_SHELL: "false"

networks:
  default:
    name: fieldos-internal
    internal: true
